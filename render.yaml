# Optional Render Blueprint. You can also deploy via the Render Web Service UI.
services:
  - type: web
    name: parole-b2
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: APP_ACCESS_CODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
